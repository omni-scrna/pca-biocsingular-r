[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge", "bioconda"]
name = "pca-biocsingular-r"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
check = "Rscript check.R"
test = "Rscript tests/smoke.R"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/pca-biocsingular-r.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/pca-biocsingular-r.yml"

[dependencies]
r-base = ">=4.5,<4.6"
# pinned to the Bioconductor release the lockfile resolves (BiocSingular 1.26 ->
# irlba 2.3.7, rsvd 1.0.5 underneath); widen together, not one at a time
bioconductor-biocsingular = ">=1.26,<1.27"
bioconductor-rhdf5 = ">=2.54,<2.55"
bioconductor-delayedarray = ">=0.36,<0.37"
bioconductor-hdf5array = ">=1.38,<1.39"
r-matrix = ">=1.7,<1.8"
r-argparser = ">=0.7,<0.8"
r-jsonlite = ">=2,<3"
r-rhpcblasctl = "*"
"r-data.table" = ">=1.18,<2"
